<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code2File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }
        .code-container {
            position: relative;
        }
        .copy-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-xl max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-white mb-2 text-center">Code2File</h1>
        <p class="text-gray-400 mb-6 text-center">
            Paste your code, select the file type, and click to download or preview.
        </p>
        
        <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mb-4">
            <div class="flex-1">
                <label for="fileType" class="block text-gray-400 font-semibold mb-2">Select File Type</label>
                <select id="fileType" class="w-full px-4 py-2 bg-gray-700 text-gray-200 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                    <option value="html">.html</option>
                    <option value="js">.js</option>
                    <option value="java">.java</option>
                    <option value="py">.py</option>
                    <option value="cpp">.cpp</option>
                    <option value="css">.css</option>
                    <option value="md">.md</option>
                    <option value="txt">.txt</option>
                </select>
            </div>
            <div class="flex-1">
                <label for="fileNameInput" class="block text-gray-400 font-semibold mb-2">File Name (Optional)</label>
                <input type="text" id="fileNameInput" class="w-full px-4 py-2 bg-gray-700 text-gray-200 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200" placeholder="my-code">
            </div>
        </div>

        <div class="relative code-container">
            <textarea id="htmlInput" class="w-full h-64 p-4 text-gray-200 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200 resize-none" placeholder="Paste your code here..."></textarea>
            <button id="copyButton" class="copy-button bg-gray-700 text-gray-400 p-2 rounded-full hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z" />
                    <path d="M5 3a2 2 0 00-2 2v6a2 2 0 002 2V5h8a2 2 0 00-2-2H5z" />
                </svg>
            </button>
        </div>

        <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mt-6">
            <button id="convertButton" class="flex-1 px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-200 shadow-md">
                Download File
            </button>
            <button id="previewButton" class="flex-1 px-6 py-3 bg-gray-600 text-white font-semibold rounded-xl hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-300 transition-all duration-200 shadow-md">
                Preview
            </button>
        </div>
        
        <div id="messageBox" class="mt-4 text-sm text-center font-medium hidden"></div>

    </div>

    <script>
        document.getElementById('convertButton').addEventListener('click', () => {
            const codeInput = document.getElementById('htmlInput').value.trim();
            const fileType = document.getElementById('fileType').value;
            const fileNameInput = document.getElementById('fileNameInput').value.trim();
            const messageBox = document.getElementById('messageBox');

            if (!codeInput) {
                messageBox.textContent = 'Please paste some code to convert.';
                messageBox.className = 'mt-4 text-sm text-center font-medium text-red-400';
                messageBox.style.display = 'block';
                return;
            }

            let fullFileContent;
            let fileName = fileNameInput;

            if (!fileName) {
                const defaultNames = {
                    'html': 'index.html',
                    'js': 'script.js',
                    'java': 'MyClass.java',
                    'py': 'script.py',
                    'cpp': 'main.cpp',
                    'css': 'style.css',
                    'md': 'README.md',
                    'txt': 'document.txt',
                };
                fileName = defaultNames[fileType];
            } else {
                if (!fileName.endsWith(`.${fileType}`)) {
                    fileName += `.${fileType}`;
                }
            }
            
            if (fileType === 'html') {
                fullFileContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${fileName.replace('.html', '')}</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1f2937;
            color: #f9fafb;
            line-height: 1.6;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    ${codeInput}
</body>
</html>`;
            } else {
                fullFileContent = codeInput;
            }

            const blob = new Blob([fullFileContent], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;

            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            messageBox.textContent = 'File downloaded successfully!';
            messageBox.className = 'mt-4 text-sm text-center font-medium text-green-400';
            messageBox.style.display = 'block';
        });

        document.getElementById('previewButton').addEventListener('click', () => {
            const codeInput = document.getElementById('htmlInput').value.trim();
            const fileType = document.getElementById('fileType').value;
            const messageBox = document.getElementById('messageBox');
            
            if (!codeInput) {
                messageBox.textContent = 'Please paste some code to preview.';
                messageBox.className = 'mt-4 text-sm text-center font-medium text-red-400';
                messageBox.style.display = 'block';
                return;
            }

            let previewContent;
            let mimeType;

            // Handle preview based on file type
            if (fileType === 'html') {
                previewContent = codeInput;
                mimeType = 'text/html';
            } else if (fileType === 'md') {
                previewContent = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Markdown Preview</title>
                        <style>
                            body { font-family: sans-serif; padding: 20px; }
                        </style>
                    </head>
                    <body>
                        ${marked.parse(codeInput)}
                    </body>
                    </html>
                `;
                mimeType = 'text/html';
            } else if (fileType === 'css') {
                previewContent = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>CSS Preview</title>
                        <style>
                            ${codeInput}
                        </style>
                    </head>
                    <body>
                        <h1>CSS Preview</h1>
                        <p>This is a paragraph to show the applied CSS styles.</p>
                        <button>A button for styling</button>
                    </body>
                    </html>
                `;
                mimeType = 'text/html';
            } else {
                previewContent = codeInput;
                mimeType = 'text/plain';
            }

            // Create a Blob and open in a new window for preview
            const blob = new Blob([previewContent], { type: mimeType });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');

            messageBox.textContent = 'Preview opened in a new tab!';
            messageBox.className = 'mt-4 text-sm text-center font-medium text-green-400';
            messageBox.style.display = 'block';
        });

        document.getElementById('copyButton').addEventListener('click', () => {
            const codeInput = document.getElementById('htmlInput');
            codeInput.select();
            document.execCommand('copy');
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = 'Code copied to clipboard!';
            messageBox.className = 'mt-4 text-sm text-center font-medium text-green-400';
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 3000);
        });
    </script>

</body>
</html>
